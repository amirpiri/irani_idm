<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download - Irani IDM</title>
<style>
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-SemiBold.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#eef2f7;--card:#fff;--tx:#1d2733;--mut:#6b7785;--bd:#d9e0e8;--ac:#2b7de9;--ok:#22a45d;--wait:#c5ced8;--er:#d33}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b2027;--card:#252c35;--tx:#e6ebf1;--mut:#98a3b0;--bd:#37414d;--ac:#4a97ff;--ok:#22a45d;--wait:#45515e;--er:#e45555}
:root{--app-scale:1;--app-font-size:14px}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{zoom:var(--app-scale);min-width:0;padding:clamp(10px,2.5vw,20px);font:var(--app-font-size) "Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{width:100%;max-width:760px;min-width:0;margin:0 auto;container-name:download-layout;container-type:inline-size}
h1{font-size:1.36em;margin:0 0 7px;overflow-wrap:anywhere}
.url{color:var(--mut);direction:ltr;text-align:start;overflow-wrap:anywhere;user-select:text;margin-bottom:20px}
.card{min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:14px;margin-bottom:12px}
.progress{height:20px;position:relative;overflow:hidden;border-radius:6px;background:var(--bg)}
.progress>span{display:block;height:100%;background:var(--ac);transition:width .3s}
.progress>strong{position:absolute;inset:0;text-align:center;font-size:.857em;line-height:20px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:12px}
.stat{display:flex;min-width:0;justify-content:space-between;gap:10px}
.stat span:last-child{min-width:0;text-align:end;overflow-wrap:anywhere}
.stat span:first-child,.segment-info{color:var(--mut)}
.section-title{font-weight:600;margin:0 0 10px}
.pieces{display:flex;direction:ltr;gap:3px;height:24px;padding:3px;background:var(--bg);border-radius:5px}
.piece{flex:1;min-width:3px;position:relative;overflow:hidden;background:var(--wait);border-radius:2px}
.piece>span{position:absolute;inset-block:0;left:0;background:var(--ac)}
.piece.done>span{background:var(--ok)}
.segment-list{display:grid;gap:8px;margin-top:12px}
.segment-row{display:grid;min-width:0;grid-template-columns:minmax(0,.7fr) minmax(100px,1fr) minmax(0,.7fr);gap:10px;align-items:center}
.segment-info{text-align:end;overflow-wrap:anywhere}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.limit{display:flex;align-items:center;justify-content:center;gap:6px}
.limit input{width:85px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px}
#error{color:var(--er);white-space:pre-wrap;overflow-wrap:anywhere}
@container download-layout (max-width:620px){
 .card{padding:12px}
 .segment-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .segment-info{grid-column:1/-1;text-align:start}
}
@container download-layout (max-width:380px){
 .stats{grid-template-columns:minmax(0,1fr)}
 .limit{flex-wrap:wrap}
}
</style>
</head>
<body>
<main>
  <h1 id="name">Download</h1>
  <div id="url" class="url"></div>
  <section class="card">
    <div class="progress" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100">
      <span id="overallBar"></span><strong id="overallPct">0%</strong>
    </div>
    <div class="stats">
      <div class="stat"><span data-i="status"></span><span id="status"></span></div>
      <div class="stat"><span data-i="size"></span><span id="size"></span></div>
      <div class="stat"><span data-i="downloaded"></span><span id="downloaded"></span></div>
      <div class="stat"><span data-i="speed"></span><span id="speed"></span></div>
      <div class="stat"><span data-i="timeLeft"></span><span id="eta"></span></div>
      <div class="stat"><span data-i="connections"></span><span id="connections"></span></div>
    </div>
  </section>
  <section class="card">
    <div class="limit"><label for="limit" data-i="limit"></label><input id="limit" type="number" min="0"><span>KB/s</span><button id="saveLimit" type="button" data-i="apply"></button></div>
    <div class="buttons">
      <button id="resume" class="primary" type="button" data-i="resume"></button>
      <button id="pause" type="button" data-i="pause"></button>
      <button id="openFile" type="button" data-i="openFile"></button>
      <button id="openFolder" type="button" data-i="openFolder"></button>
      <button id="close" type="button" data-i="close"></button>
    </div>
  </section>
  <section class="card">
    <div class="section-title" data-i="parts"></div>
    <div id="pieces" class="pieces"></div>
    <div id="segmentList" class="segment-list"></div>
  </section>
  <div id="error" role="alert"></div>
</main>
<script>
const {invoke}=window.__TAURI__.core,{listen}=window.__TAURI__.event;
const currentWindow=window.__TAURI__.window.getCurrentWindow();
const id=Number(currentWindow.label.slice("download-".length));
const lang=localStorage.lang||(navigator.language.startsWith("fa")?"fa":"en");
let themeMode=["system","light","dark"].includes(localStorage.theme)?localStorage.theme:"system";
function applyDisplaySettings(){
 const readSetting=(key,min,max,fallback)=>{
  const stored=localStorage.getItem(key);
  if(stored===null)return fallback;
  const value=Number(stored);
  return Number.isFinite(value)?Math.min(max,Math.max(min,value)):fallback;
 };
 document.documentElement.style.setProperty("--app-scale",String(readSetting("appScale",80,120,100)/100));
 document.documentElement.style.setProperty("--app-font-size",readSetting("appFontSize",12,18,14)+"px");
}
const words={
 en:{status:"Status",size:"Size",downloaded:"Downloaded",speed:"Speed",timeLeft:"Time left",connections:"Connections",parts:"Connection parts",limit:"Speed limit (0 = unlimited)",apply:"Apply",resume:"Resume",pause:"Pause",openFile:"Open file",openFolder:"Open folder",close:"Close",preparing:"Preparing…",downloading:"Downloading",paused:"Paused",completed:"Completed",error:"Error",waiting:"Waiting",receiving:"Receiving",done:"Done",connection:"Connection",h:"h",m:"m",s:"s"},
 fa:{status:"وضعیت",size:"اندازه",downloaded:"دانلود شده",speed:"سرعت",timeLeft:"زمان باقیمانده",connections:"اتصال‌ها",parts:"بخش‌های اتصال",limit:"محدودیت سرعت (۰ = نامحدود)",apply:"اعمال",resume:"ادامه",pause:"توقف",openFile:"باز کردن فایل",openFolder:"باز کردن پوشه",close:"بستن",preparing:"در حال آماده‌سازی…",downloading:"در حال دانلود",paused:"متوقف",completed:"کامل",error:"خطا",waiting:"در انتظار",receiving:"در حال دریافت",done:"انجام شد",connection:"اتصال",h:"ساعت",m:"دقیقه",s:"ثانیه"}
};
const t=key=>words[lang][key]||key;
const $=name=>document.getElementById(name);
function applyTheme(){
 const theme=themeMode==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):themeMode;
 document.documentElement.dataset.theme=theme;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themeMode==="system")applyTheme()});
window.addEventListener("storage",event=>{
 if(event.key==="theme"){themeMode=["system","light","dark"].includes(event.newValue)?event.newValue:"system";applyTheme()}
 if(event.key==="appScale"||event.key==="appFontSize")applyDisplaySettings();
});
const nf=(value,digits=1)=>new Intl.NumberFormat(lang==="fa"?"fa-IR":"en-US",{maximumFractionDigits:digits}).format(value);
function bytes(value){
 if(value==null)return"—";
 const units=["B","KB","MB","GB","TB"];let unit=0;
 while(value>=1024&&unit<units.length-1){value/=1024;unit++}
 return nf(value,unit?2:0)+" "+units[unit];
}
function duration(value){
 if(value==null)return"—";
 const hours=Math.floor(value/3600),minutes=Math.floor(value%3600/60),seconds=value%60;
 return [hours&&`${nf(hours,0)} ${t("h")}`,(hours||minutes)&&`${nf(minutes,0)} ${t("m")}`,`${nf(seconds,0)} ${t("s")}`].filter(Boolean).join(" ");
}
function showError(message=""){$("error").textContent=message}
function render(download){
 document.title=`${download.name} - Irani IDM`;
 $("name").textContent=download.name;
 $("url").textContent=download.url;
 const percent=download.total?Math.min(100,download.downloaded/download.total*100):(download.status==="completed"?100:0);
 $("overallBar").style.width=percent+"%";
 $("overallPct").textContent=nf(percent)+"%";
 $("overallBar").parentElement.setAttribute("aria-valuenow",String(Math.round(percent)));
 $("status").textContent=download.error||t(download.status);
 $("size").textContent=bytes(download.total);
 $("downloaded").textContent=bytes(download.downloaded);
 $("speed").textContent=download.status==="downloading"?bytes(download.speed)+"/s":"—";
 $("eta").textContent=download.status==="downloading"?duration(download.eta):"—";
 $("connections").textContent=`${nf(download.segments.filter(segment=>segment.state===1).length,0)}/${nf(download.segments.length,0)}`;
 if(document.activeElement!==$("limit"))$("limit").value=download.limit_kbps;
 $("resume").disabled=download.status==="completed"||download.status==="downloading"||download.status==="preparing";
 $("pause").disabled=download.status!=="downloading";
 $("openFile").disabled=download.status!=="completed";
 const states=["waiting","receiving","done"];
 $("pieces").innerHTML=download.segments.map((segment,index)=>{
  const progress=segment.total?Math.min(100,segment.done/segment.total*100):(segment.state===2?100:0);
  const state=states[segment.state]||"waiting";
  const piece=$("pieces").ownerDocument.createElement("span");
  piece.textContent=`${t("connection")} ${nf(index+1,0)}: ${nf(progress)}%`;
  return `<span class="piece ${state==="done"?"done":""}" role="img" aria-label="${piece.textContent}" title="${piece.textContent}"><span style="width:${progress}%"></span></span>`;
 }).join("");
 $("segmentList").innerHTML=download.segments.map((segment,index)=>{
  const progress=segment.total?Math.min(100,segment.done/segment.total*100):(segment.state===2?100:0);
  const state=states[segment.state]||"waiting";
  return `<div class="segment-row"><span>${t("connection")} ${nf(index+1,0)}</span><div class="progress"><span style="width:${progress}%"></span><strong>${nf(progress)}%</strong></div><span class="segment-info">${bytes(segment.done)} / ${bytes(segment.total)} · ${t(state)}</span></div>`;
 }).join("");
}
async function action(command,args={}){
 try{showError();await invoke(command,{id,...args})}
 catch(error){showError(String(error))}
}
document.documentElement.lang=lang;
document.documentElement.dir=lang==="fa"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(element=>element.textContent=t(element.dataset.i));
applyTheme();
applyDisplaySettings();
$("resume").addEventListener("click",()=>action("resume"));
$("pause").addEventListener("click",()=>action("pause"));
$("openFile").addEventListener("click",()=>action("open_item",{folder:false}));
$("openFolder").addEventListener("click",()=>action("open_item",{folder:true}));
$("saveLimit").addEventListener("click",()=>action("set_limit",{kbps:Math.max(0,+$("limit").value||0)}));
$("close").addEventListener("click",()=>currentWindow.close().catch(error=>showError(String(error))));
document.addEventListener("contextmenu",event=>event.preventDefault());
listen("downloads",event=>{
 const download=event.payload.find(item=>item.id===id);
 if(download)render(download);
 else showError("Download not found.");
}).catch(error=>showError(String(error)));
invoke("download_view",{id}).then(render).catch(error=>showError(String(error)));
</script>
</body>
</html>
