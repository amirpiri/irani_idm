<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irani IDM</title>
<style>
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-SemiBold.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#eef2f7;--card:#fff;--tx:#1d2733;--mut:#6b7785;--bd:#d9e0e8;--ac:#2b7de9;--sel:#bcd5f7;--ok:#22a45d;--er:#d33;--window-opacity:100%;--bg-glass:color-mix(in srgb,var(--bg) var(--window-opacity),transparent);--card-glass:color-mix(in srgb,var(--card) var(--window-opacity),transparent);--sel-glass:color-mix(in srgb,var(--sel) var(--window-opacity),transparent)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b2027;--card:#252c35;--tx:#e6ebf1;--mut:#98a3b0;--bd:#37414d;--ac:#4a97ff;--sel:#2b4466;--ok:#22a45d;--er:#e45555}
:root[data-palette="violet"]{--bg:#f3effb;--card:#fff;--tx:#29213c;--mut:#776b8d;--bd:#e2d9f0;--ac:#8254d7;--sel:#e5d8fb}
:root[data-theme="dark"][data-palette="violet"]{--bg:#201b2c;--card:#2d253d;--tx:#f0eafa;--mut:#b2a4c9;--bd:#47395d;--ac:#b18af4;--sel:#49366a}
:root[data-palette="emerald"]{--bg:#edf5f0;--card:#fff;--tx:#1c3027;--mut:#667d70;--bd:#d6e5db;--ac:#16865b;--sel:#ccebdc}
:root[data-theme="dark"][data-palette="emerald"]{--bg:#192720;--card:#23352b;--tx:#e5f4eb;--mut:#9bb8a6;--bd:#365343;--ac:#42c98c;--sel:#2d5944}
:root[data-palette="sunset"]{--bg:#fff2e9;--card:#fff;--tx:#42291f;--mut:#927365;--bd:#f0d9ca;--ac:#e66b3d;--sel:#ffddca}
:root[data-theme="dark"][data-palette="sunset"]{--bg:#2b201d;--card:#3a2b26;--tx:#fff0e8;--mut:#c5a294;--bd:#594039;--ac:#ff9367;--sel:#62402f}
:root[data-palette="rose"]{--bg:#fff0f4;--card:#fff;--tx:#3c202c;--mut:#8d6877;--bd:#efd7e0;--ac:#d94e83;--sel:#f9d5e3}
:root[data-theme="dark"][data-palette="rose"]{--bg:#2b1d26;--card:#392632;--tx:#ffedf4;--mut:#c39bad;--bd:#563849;--ac:#f47cab;--sel:#5c3047}
:root[data-palette="cyan"]{--bg:#eaf5f8;--card:#fff;--tx:#19313a;--mut:#63808a;--bd:#d1e5eb;--ac:#078ba8;--sel:#c9edf4}
:root[data-theme="dark"][data-palette="cyan"]{--bg:#18272c;--card:#22363d;--tx:#e6f7fb;--mut:#98b9c2;--bd:#34515a;--ac:#40c5df;--sel:#28515d}
:root[data-palette="amber"]{--bg:#faf4e8;--card:#fff;--tx:#382d19;--mut:#887653;--bd:#e9dfc8;--ac:#bd821b;--sel:#f3e2b9}
:root[data-theme="dark"][data-palette="amber"]{--bg:#29251b;--card:#383122;--tx:#fff5dc;--mut:#c3b18a;--bd:#55482d;--ac:#edb94e;--sel:#594722}
:root[data-palette="indigo"]{--bg:#eef0fb;--card:#fff;--tx:#222747;--mut:#68719a;--bd:#d9def2;--ac:#5865d9;--sel:#dce0fb}
:root[data-theme="dark"][data-palette="indigo"]{--bg:#1d2036;--card:#292e49;--tx:#eef0ff;--mut:#a5acd2;--bd:#41496d;--ac:#929cff;--sel:#373e68}
:root[data-palette="mint"]{--bg:#eaf7f3;--card:#fff;--tx:#1d3933;--mut:#64847b;--bd:#d0e9e1;--ac:#159b83;--sel:#c9eee4}
:root[data-theme="dark"][data-palette="mint"]{--bg:#182b28;--card:#233b36;--tx:#e7faf5;--mut:#9bbeb4;--bd:#365b51;--ac:#51d3b5;--sel:#28554b}
:root[data-palette="coral"]{--bg:#fff0ed;--card:#fff;--tx:#432522;--mut:#956e68;--bd:#f1d8d2;--ac:#ed6658;--sel:#ffdad4}
:root[data-theme="dark"][data-palette="coral"]{--bg:#2d201f;--card:#3c2b29;--tx:#fff0ed;--mut:#c5a09a;--bd:#60413d;--ac:#ff9385;--sel:#603a37}
:root[data-palette="graphite"]{--bg:#eff1f3;--card:#fff;--tx:#252b33;--mut:#707b87;--bd:#d9dee4;--ac:#566474;--sel:#dce2e9}
:root[data-theme="dark"][data-palette="graphite"]{--bg:#1d2229;--card:#292f38;--tx:#edf1f5;--mut:#a2acb8;--bd:#414b58;--ac:#a8bacd;--sel:#394655}
:root{--app-scale:1;--app-font-size:14px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{zoom:var(--app-scale);font:var(--app-font-size) "Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg-glass);color:var(--tx);display:flex;flex-direction:column;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
#bar{display:flex;gap:2px;padding:8px 10px;background:var(--card-glass);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tb{background:none;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.tb:hover:not(:disabled){background:var(--bg-glass)}.tb:disabled{opacity:.6;cursor:wait}.tb svg{width:24px;height:24px;display:block;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tb svg .icon-bg{stroke:none}.tb svg .icon-solid{stroke:none}.tb span{font-size:calc(var(--app-font-size)*.857)}
.sep{width:1px;background:var(--bd);margin:4px 6px}
#main{flex:1;display:flex;min-height:0}
#appVersion{padding:4px 12px;color:var(--mut);font-size:.8em;text-align:end;direction:ltr;user-select:text}
#side{width:200px;background:var(--card-glass);border-inline-start:1px solid var(--bd);padding:8px;overflow:auto;order:2}
#side h4{margin:4px 8px 8px}
.cat{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.cat:hover{background:var(--bg-glass)}.cat.on{background:var(--sel-glass)}
#content{flex:1;display:flex;flex-direction:column;padding:10px;gap:10px;min-width:0;order:1}
#top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{background:var(--card-glass);padding:10px 16px;border-radius:12px;font-weight:600}
#q{flex:1;min-width:160px;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card-glass);user-select:text}
#tw{flex:1;overflow:auto;background:var(--card-glass);border-radius:12px;border:1px solid var(--bd)}
table{width:100%;min-width:720px;table-layout:fixed;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card-glass);text-align:start;padding:8px 10px;border-bottom:1px solid var(--bd);font-weight:600}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]:hover{color:var(--ac)}th[data-sort]::after{content:"↕";display:inline-block;margin-inline-start:7px;color:var(--mut);font-family:Arial,sans-serif;font-size:1.05em;font-weight:900;line-height:1;-webkit-text-stroke:1px currentColor;vertical-align:-.04em}th[data-sort][aria-sort="ascending"]::after{content:"↑";color:var(--ac);font-size:1.15em;-webkit-text-stroke:1.2px currentColor}th[data-sort][aria-sort="descending"]::after{content:"↓";color:var(--ac);font-size:1.15em;-webkit-text-stroke:1.2px currentColor}
td{padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td:nth-child(5),td:nth-child(6){overflow:hidden;text-overflow:ellipsis}
tr.r{cursor:default}tr.r.sel{background:var(--sel-glass)}
th.pick,td.pick{width:38px;text-align:center;padding-inline:5px}td.pick input,th.pick input{width:16px;height:16px;accent-color:var(--ac);cursor:pointer}
td.n{max-width:360px;overflow:hidden;text-overflow:ellipsis}
.pb{height:16px;background:var(--bg-glass);border-radius:8px;overflow:hidden;min-width:90px;position:relative}
.pb>div{height:100%;position:relative;background:var(--ac);transition:width .3s}.pb.ok>div{background:var(--ok)}.pb.er>div{background:var(--er)}
.pb.active>div{animation:progress-glow 1.2s ease-in-out infinite alternate;animation-delay:var(--glow-delay,0s)}
.pb.active>div::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,color-mix(in srgb,#fff 22%,transparent) 0 25%,transparent 25% 50%,color-mix(in srgb,#fff 22%,transparent) 50% 75%,transparent 75% 100%);background-size:1rem 1rem;animation:progress-stripes 1s linear infinite;animation-delay:var(--stripes-delay,0s)}
@keyframes progress-glow{from{filter:brightness(1);box-shadow:0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}to{filter:brightness(1.3);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 75%,transparent)}}
@keyframes progress-stripes{from{background-position:1rem 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.pb.active>div,.pb.active>div::after{animation:none}.pb>div{transition:none}}
.pb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx);text-align:center;font-size:calc(var(--app-font-size)*.786);line-height:16px;pointer-events:none}
.pb.is-over-half b{color:color-mix(in srgb,var(--tx) 10%,#000);font-weight:700;text-shadow:0 0 2px var(--card),0 0 4px var(--card)}
:root[data-theme="dark"] .pb.is-over-half b{color:var(--tx);text-shadow:0 0 2px var(--card),0 0 4px var(--card)}
.proxy-badge{display:inline-flex;align-items:center;gap:3px;margin-inline-start:7px;padding:1px 6px;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--bd));border-radius:999px;background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok);font-size:.78em;font-weight:600;vertical-align:middle}
.proxy-badge[hidden]{display:none!important}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card-glass);color:var(--tx);padding:16px;width:min(620px,94vw);max-height:90vh;overflow-y:auto}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 10px}
.update-notes{max-height:42vh;overflow:auto;margin:12px 0;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg-glass);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;direction:auto;line-height:1.6}
.settings-tabs{display:flex;gap:6px;padding:4px;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.settings-tab{flex:1;padding:9px 12px;border:0;border-bottom:2px solid transparent;border-radius:7px 7px 0 0;background:transparent;color:var(--mut);cursor:pointer}
.settings-tab:hover{background:var(--bg-glass);color:var(--tx)}
.settings-tab[aria-selected="true"]{border-bottom-color:var(--ac);background:var(--sel-glass);color:var(--tx);font-weight:600}
.settings-panel[hidden]{display:none}
.settings-panel{min-height:300px}
.settings-panel .fld:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.row span:first-child{color:var(--mut)}
.url{direction:ltr;text-align:start;word-break:break-all;font-size:calc(var(--app-font-size)*.857);user-select:text;margin-bottom:8px}
textarea{width:100%;height:110px;direction:ltr;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg-glass)}
input,select{padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg-glass)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card-glass);cursor:pointer}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.sg{max-height:150px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.sg td,.sg th{padding:3px 8px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.fld input.switch{appearance:none;-webkit-appearance:none;position:relative;width:42px;height:24px;flex:0 0 42px;margin:0;padding:0;border:1px solid var(--bd);border-radius:999px;background:var(--mut);cursor:pointer;transition:background .18s,border-color .18s}
.fld input.switch::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .18s}
.fld input.switch:checked{background:var(--ac);border-color:var(--ac)}
.fld input.switch:checked::before{transform:translateX(18px)}
.fld input.switch:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.fld input.switch:disabled{opacity:.55;cursor:default}
.fld.dir{justify-content:initial}.fld.dir input{min-width:0}
.palette-heading{font-weight:600;margin:14px 0 9px}
.palette-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.palette-option{position:relative;display:flex;align-items:center;gap:8px;min-width:0;min-height:43px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card-glass);cursor:pointer;text-align:start;transition:border-color .15s,background .15s,transform .15s}
.palette-option:hover{border-color:var(--ac);transform:translateY(-1px)}
.palette-option:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.palette-option[aria-pressed="true"]{border:2px solid var(--ac);padding:7px;background:var(--sel-glass)}
.palette-option[aria-pressed="true"]::after{content:"✓";margin-inline-start:auto;color:var(--ac);font-size:.9em;font-weight:700}
.palette-dot{width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:var(--swatch);box-shadow:inset 0 0 0 1px #0001}
.palette-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88em}
.browser-install-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 5px}
.browser-install{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;padding:10px 8px;border:1px solid var(--bd);border-radius:9px;background:var(--card-glass);cursor:pointer;transition:border-color .15s,background .15s}
.browser-install:hover{border-color:var(--ac);background:var(--sel-glass)}
.browser-install:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.browser-install svg{width:22px;height:22px;flex:0 0 22px}
.browser-install span{font-size:.9em;font-weight:600;white-space:nowrap}
.browser-install-hint{margin:4px 0 12px;color:var(--mut);font-size:.82em;line-height:1.5}
@media(max-width:460px){.palette-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.palette-option{transition:none}}
.fld.range input[type=range]{flex:1;min-width:100px;padding:0;accent-color:var(--ac)}
.fld.range output{min-width:48px;text-align:end;color:var(--mut);direction:ltr}
#rowMenu{position:fixed;z-index:10;min-width:210px;padding:5px;background:var(--card-glass);color:var(--tx);font:var(--app-font-size) "Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;border:1px solid var(--bd);border-radius:9px;box-shadow:0 6px 20px #0003}
#rowMenu[hidden]{display:none}
#rowMenu button{display:block;width:100%;padding:8px 12px;border:0;border-radius:5px;background:transparent;text-align:start;cursor:pointer}
#rowMenu button:hover:not(:disabled){background:var(--bg-glass)}
#rowMenu button:disabled{opacity:.5;cursor:default}
.menu-sep{height:1px;margin:4px 5px;background:var(--bd)}
</style>
</head>
<body>
<div id="bar">
  <button class="tb" onclick="openAdd()"><svg aria-hidden="true" viewBox="0 0 24 24"><circle class="icon-bg" cx="12" cy="12" r="10" fill="#e7f1ff"/><path d="M12 6v12M6 12h12" stroke="#2475d2" stroke-width="2.4"/></svg><span data-i="add"></span></button>
  <button class="tb" onclick="resumeSelected()"><svg aria-hidden="true" viewBox="0 0 24 24"><circle class="icon-bg" cx="12" cy="12" r="10" fill="#e3f7eb"/><path class="icon-solid" d="m9 6 10 6-10 6z" fill="#219653"/></svg><span data-i="resume"></span></button>
  <button class="tb" onclick="act('pause')"><svg aria-hidden="true" viewBox="0 0 24 24"><rect class="icon-bg" x="2" y="2" width="20" height="20" rx="6" fill="#fff0ed"/><path d="M8 8v8m8-8v8" stroke="#dc5145" stroke-width="2.5"/></svg><span data-i="stop"></span></button>
  <button class="tb" onclick="invoke('pause_all')"><svg aria-hidden="true" viewBox="0 0 24 24"><circle class="icon-bg" cx="12" cy="12" r="10" fill="#f1eaff"/><path d="M8 8v8m8-8v8" stroke="#8054c7" stroke-width="2.5"/></svg><span data-i="stopAll"></span></button>
  <div class="sep"></div>
  <button class="tb" onclick="del()"><svg aria-hidden="true" viewBox="0 0 24 24"><path class="icon-bg" d="M5 7h14l-1 13H6z" fill="#ffe1df"/><path d="M3.5 6h17M9 6V4h6v2m-5 4v7m4-7v7" stroke="#d64b48"/></svg><span data-i="del"></span></button>
  <button class="tb" onclick="delDone()"><svg aria-hidden="true" viewBox="0 0 24 24"><path class="icon-bg" d="m5 7 1.5 13h11L19 7z" fill="#e2f5e8"/><path d="M3.5 6h17M9 6V4h6v2" stroke="#338c55"/><path d="m9 13 2 2 4-4" stroke="#338c55" stroke-width="2.2"/></svg><span data-i="delDone"></span></button>
  <div class="sep"></div>
  <button class="tb" onclick="openSet()"><svg aria-hidden="true" viewBox="0 0 24 24"><path class="icon-bg" d="m9.7 2.8 4.6 0 .6 2.1 1.7 1 2.1-.6 2.3 4-1.5 1.6v2l1.5 1.7-2.3 4-2.1-.7-1.7 1-.6 2.1H9.7L9 18.9l-1.7-1-2.1.7-2.3-4 1.5-1.7v-2L2.9 9.3l2.3-4 2.1.6 1.7-1z" fill="#e7edfa"/><circle cx="12" cy="12" r="3.3" fill="#fff" stroke="#6579a8"/></svg><span data-i="settings"></span></button>
  <button class="tb" onclick="invoke('resume_all')"><svg aria-hidden="true" viewBox="0 0 24 24"><path class="icon-bg" d="M4 15h16l-1 6H5z" fill="#dceeff"/><path d="M12 2v12m-5-5 5 5 5-5m-2 2 2 3" stroke="#2378c8" stroke-width="2"/><path d="M4 15h16" stroke="#2378c8"/></svg><span data-i="startQ"></span></button>
  <button class="tb" onclick="openProjectPage()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5H5v14h14v-4M13 5h6v6M19 5l-9 9"/></svg><span data-i="projectPage"></span></button>
  <button class="tb" id="checkUpdateButton" onclick="checkForUpdate(true)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg><span data-i="checkUpdate"></span></button>
</div>
<div id="main">
  <div id="side"><h4 data-i="groups"></h4><div id="cats"></div></div>
  <div id="content">
    <div id="top">
      <div class="stat" id="sAct"></div><div class="stat" id="sDone"></div><div class="stat" id="sSelected" hidden></div>
      <input id="q" data-p="search" oninput="q=this.value.toLowerCase();render()">
    </div>
    <div id="tw"><table><colgroup><col style="width:38px"><col style="width:25%"><col style="width:15%"><col style="width:10%"><col style="width:9%"><col style="width:17%"><col style="width:10%"><col style="width:10%"></colgroup><thead><tr>
      <th class="pick"><input id="selectVisible" type="checkbox" aria-label="Select visible downloads" title="Select visible downloads"></th><th data-i="name" data-sort="name" tabindex="0" role="button"></th><th data-i="addedAt" data-sort="addedAt" tabindex="0" role="button"></th><th data-i="size" data-sort="size" tabindex="0" role="button"></th><th data-i="connections" data-sort="connections" tabindex="0" role="button"></th><th data-i="status" data-sort="status" tabindex="0" role="button"></th><th data-i="timeLeft" data-sort="timeLeft" tabindex="0" role="button"></th><th data-i="speed" data-sort="speed" tabindex="0" role="button"></th>
    </tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>
<footer id="appVersion" aria-label="Application version"></footer>

<dialog id="dAdd"><h3 data-i="addTitle"></h3>
  <div data-i="addHint" style="color:var(--mut);margin-bottom:6px"></div>
  <textarea id="urls" placeholder="https://"></textarea>
  <div class="acts"><button class="btn" onclick="dAdd.close()" data-i="cancel"></button><button class="btn p" onclick="doAdd()" data-i="ok"></button></div>
</dialog>

<dialog id="dSet"><h3 data-i="settings"></h3>
  <div class="settings-tabs" role="tablist" aria-label="Settings categories">
    <button class="settings-tab" id="settingsTabGeneral" type="button" role="tab" aria-controls="settingsGeneral" aria-selected="true" onclick="setSettingsTab('general')" data-i="general"></button>
    <button class="settings-tab" id="settingsTabAppearance" type="button" role="tab" aria-controls="settingsAppearance" aria-selected="false" onclick="setSettingsTab('appearance')" data-i="appearance"></button>
    <button class="settings-tab" id="settingsTabProxy" type="button" role="tab" aria-controls="settingsProxy" aria-selected="false" onclick="setSettingsTab('proxy')" data-i="proxy"></button>

}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themeMode==="system")applyTheme()});
window.addEventListener("storage",event=>{
 if(event.key==="theme"){themeMode=["system","light","dark"].includes(event.newValue)?event.newValue:"system";applyTheme()}
 if(event.key==="colorTheme"){colorTheme=PALETTES.some(p=>p.id===event.newValue)?event.newValue:"ocean";applyTheme();renderPalettes()}
 if(event.key==="appScale"||event.key==="appFontSize"){
  appScale=readDisplaySetting("appScale",80,120,100);appFontSize=readDisplaySetting("appFontSize",12,18,14);applyDisplaySettings();
 }
 if(event.key==="windowOpacity"){windowOpacity=readDisplaySetting("windowOpacity",30,100,100);applyDisplaySettings()}
});
const localeForLang=()=>({fa:"fa-IR",zh:"zh-CN",ru:"ru-RU",ar:"ar-SA",ur:"ur-PK",nl:"nl-NL",es:"es-ES"}[lang]||"en-US");
const nf=(n,d=1)=>new Intl.NumberFormat(localeForLang(),{maximumFractionDigits:d}).format(n);
const addedAtFormat=new Intl.DateTimeFormat(lang==="fa"?"fa-IR-u-ca-persian":localeForLang(),{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const addedAt=d=>d.added_at_ms?addedAtFormat.format(new Date(d.added_at_ms)):"—";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bytes(n){if(n==null)return"—";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return nf(n,i?2:0)+" "+u[i]}
function dur(s){if(s==null)return"—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
 return [h&&nf(h,0)+" "+t("h"),(h||m)&&nf(m,0)+" "+t("m"),nf(x,0)+" "+t("s")].filter(Boolean).join(" ")}
const pct=d=>d.total?Math.min(100,d.downloaded/d.total*100):(d.status==="completed"?100:0);
const catOf=d=>{const e=d.name.split(".").pop().toLowerCase();return Object.keys(EXT).find(k=>EXT[k].split(" ").includes(e))};

function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=["fa","ar","ur"].includes(lang)?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 renderAppVersion();
 renderPalettes();
 render();
}
function render(){
 const animationTime=performance.now();
 const vis=data.filter(d=>(!q||d.name.toLowerCase().includes(q))&&(cat==="all"||(cat==="unfinished"?d.status!=="completed":cat==="completed"?d.status==="completed":catOf(d)===cat)));
 if(sortKey){const direction=sortDirection==="ascending"?1:-1;vis.sort((a,b)=>{let av,bv;switch(sortKey){case"name":av=a.name.toLocaleLowerCase();bv=b.name.toLocaleLowerCase();break;case"addedAt":av=a.added_at_ms??null;bv=b.added_at_ms??null;break;case"size":av=a.total??null;bv=b.total??null;break;case"connections":av=a.segments.filter(s=>s.state===1).length;bv=b.segments.filter(s=>s.state===1).length;break;case"status":av=a.status;bv=b.status;break;case"timeLeft":av=a.eta??null;bv=b.eta??null;break;case"speed":av=a.speed??null;bv=b.speed??null;break;}if(av===null)return bv===null?0:1;if(bv===null)return -1;return(typeof av==="string"?av.localeCompare(bv):av-bv)*direction})}
 document.querySelectorAll("th[data-sort]").forEach(header=>{const active=header.dataset.sort===sortKey;header.setAttribute("aria-sort",active?sortDirection:"none")});
 selectedIds=new Set([...selectedIds].filter(id=>data.some(d=>d.id===id)));
 $("tb").innerHTML=vis.map(d=>{const p=pct(d),c=d.status==="completed"?"ok":d.status==="error"?"er":"";
  const st=d.status==="error"?esc(d.error||t("st_error")):t("st_"+d.status);
  const activeConnections=d.segments.filter(s=>s.state===1).length;
  return `<tr class="r ${selectedIds.has(d.id)?"sel":""}" data-id="${d.id}"><td class="pick"><input type="checkbox" data-select-id="${d.id}" aria-label="Select ${esc(d.name)}" ${selectedIds.has(d.id)?"checked":""}></td><td class="n" title="${esc(d.name)}">${esc(d.name)}${d.proxy_used?`<span class="proxy-badge" title="${t("proxyUsed")}">↗ ${t("proxy")}</span>`:""}</td><td title="${t("addedAt")}">${addedAt(d)}</td><td>${bytes(d.total)}</td>
  <td title="${t("connections")}">${nf(activeConnections,0)}/${nf(d.connections,0)}</td>
  <td><div class="pb ${c} ${p>=55?"is-over-half":""} ${d.status==="downloading"?"active":""}"><div style="width:${p}%;--glow-delay:-${(animationTime%2400)/1000}s;--stripes-delay:-${(animationTime%1000)/1000}s"></div><b>${nf(p)}%</b></div><small>${st}</small></td>
  <td>${d.status==="downloading"?dur(d.eta):"—"}</td><td>${d.status==="downloading"?bytes(d.speed)+"/s":"—"}</td></tr>`}).join("");
 const selectVisible=$("selectVisible");selectVisible.checked=vis.length>0&&vis.every(d=>selectedIds.has(d.id));selectVisible.indeterminate=vis.some(d=>selectedIds.has(d.id))&&!selectVisible.checked;selectVisible.title=t("selectAll");selectVisible.setAttribute("aria-label",t("selectAll"));
 const cats=$("cats");
 if(cats.childElementCount!==CATS.length){
  cats.innerHTML=CATS.map(c=>`<div class="cat" data-c="${c}"><span>${t(c)}</span></div>`).join("");
 }
 for(const element of cats.children){
  const selected=element.dataset.c===cat;
  element.firstElementChild.textContent=t(element.dataset.c);
  element.classList.toggle("on",selected);
 }
 const act=data.filter(d=>d.status==="downloading");
 $("sAct").textContent=t("active")+" "+nf(act.length,0);
 $("sDone").textContent=t("complete")+" "+nf(data.filter(d=>d.status==="completed").length,0);
 $("sSelected").hidden=selectedIds.size===0;$("sSelected").textContent=nf(selectedIds.size,0)+" "+t("selected");
 if(!$("rowMenu").hidden)renderRowMenu();
}
function hideRowMenu(){$("rowMenu").hidden=true}
function renderRowMenu(){
 const d=data.find(x=>x.id===sel);if(!d){hideRowMenu();return}
 $("rowMenu").querySelector('[data-action="toggle"]').textContent=t(d.status==="downloading"?"pauseB":"resumeB");
 $("rowMenu").querySelector('[data-action="toggle"]').disabled=d.status==="completed"||d.status==="preparing";
 $("rowMenu").querySelector('[data-action="openFile"]').disabled=d.status!=="completed";
}

async function openDownloadWindow(id){
 try{await invoke("open_download_window",{id})}catch(e){alert(String(e))}
}
async function resumeDownload(id){
 if(!data.some(d=>d.id===id))return;
 try{await invoke("open_download_window",{id});await invoke("resume",{id})}
 catch(e){alert(String(e))}
}
const resumeSelected=async()=>{const ids=selectedIds.size?[...selectedIds]:sel==null?[]:[sel];for(const id of ids){const d=data.find(x=>x.id===id);if(d&&["paused","error"].includes(d.status))await resumeDownload(id)}};
const act=async c=>{const ids=selectedIds.size?[...selectedIds]:sel==null?[]:[sel];for(const id of ids){const d=data.find(x=>x.id===id);if(d&&d.status==="downloading")await invoke(c,{id})}};
async function del(){
 if(!selectedIds.size&&sel!=null)selectedIds.add(sel);if(!selectedIds.size)return;
 $("dDelete").showModal();
}
async function removeSelected(deleteFile){
 const ids=[...selectedIds];if(!ids.length)return;
 $("dDelete").close();
 const results=await Promise.allSettled(ids.map(id=>invoke("remove",{id,deleteFile})));
 const failed=results.map((result,index)=>({result,id:ids[index]})).filter(x=>x.result.status==="rejected");
 for(const id of ids)if(!failed.some(x=>x.id===id))selectedIds.delete(id);
 if(sel!=null&&!data.some(d=>d.id===sel&&!selectedIds.has(sel)))sel=null;
 render();if(failed.length)alert(failed.map(x=>`${data.find(d=>d.id===x.id)?.name||x.id}: ${x.result.reason}`).join("\n"));
}
async function delDone(){
 try{await Promise.all(data.filter(d=>d.status==="completed").map(d=>invoke("remove",{id:d.id,deleteFile:false})))}
 catch(error){alert(String(error))}
}
async function runRowAction(action,id){
 const d=data.find(x=>x.id===id);if(!d)return;
 try{
  switch(action){
   case "toggle":
    if(d.status==="downloading")await invoke("pause",{id});
    else {await resumeDownload(id);return}
    break;
   case "openFile":await invoke("open_item",{id,folder:false});break;
   case "openFolder":await invoke("open_item",{id,folder:true});break;
   case "details":await invoke("open_download_window",{id});break;
   case "copyUrl":await navigator.clipboard.writeText(d.url);break;
   case "remove":del();break;
  }
 }catch(e){alert(action==="copyUrl"?t("copyFailed")+"\n"+e:String(e))}
}
async function openAdd(){$("urls").value="";try{const c=(await navigator.clipboard.readText()).trim();if(/^https?:\/\//i.test(c))$("urls").value=c}catch{}$("dAdd").showModal()}
async function doAdd(){
 await connectionSettingsReady;
 const list=$("urls").value.split(/\s+/).filter(Boolean);$("dAdd").close();
 for(const url of list){
  let id;
  try{id=await invoke("add_download",{url,dir:dir||null,connections:conns})}
  catch(error){alert(url+"\n"+error);continue}
  try{await invoke("open_download_window",{id})}
  catch(error){alert(t("addTitle")+": "+error)}
 }
}
async function openSet(){
 $("sLang").value=lang;$("sTheme").value=themeMode;$("sConn").value=conns;$("sDir").value=dir;$("sCompletionAction").value=completionAction;
 $("sScale").value=appScale;$("sScaleValue").textContent=appScale+"%";
 $("sFontSize").value=appFontSize;$("sFontSizeValue").textContent=appFontSize+" px";
 $("sTransparency").value=windowOpacity;$("sTransparencyValue").textContent=(100-windowOpacity)+"%";
 $("proxyError").textContent="";
 try{
  const proxy=await invoke("get_proxy_settings");
  $("sProxyEnabled").checked=proxy.enabled;$("sProxyType").value=proxy.protocol;
  $("sProxyHost").value=proxy.host;$("sProxyPort").value=proxy.port;
  $("sProxyUsername").value=proxy.username;$("sProxyPassword").value=proxy.password;
 }catch(error){$("proxyError").textContent=String(error)}
 renderPalettes();setSettingsTab("general");
 $("dSet").showModal();
}
function setSettingsTab(tab){
 const tabs=["general","appearance","proxy"];
 if(!tabs.includes(tab))return;
 for(const name of tabs){
  const selected=name===tab;
  $("settingsTab"+name[0].toUpperCase()+name.slice(1)).setAttribute("aria-selected",String(selected));
  $("settings"+name[0].toUpperCase()+name.slice(1)).hidden=!selected;
 }
}
async function browseDir(){
 try{
  const path=await window.__TAURI__.dialog.open({directory:true,multiple:false});
  if(typeof path==="string")$("sDir").value=path;
 }catch(e){alert(String(e))}
}
async function testProxy(){
 $("proxyError").textContent=t("testingProxy");
 const settings={enabled:true,protocol:$("sProxyType").value,host:$("sProxyHost").value.trim(),port:Math.min(65535,Math.max(1,Number($("sProxyPort").value)||0)),username:$("sProxyUsername").value,password:$("sProxyPassword").value};
 try{
  const result=await invoke("test_proxy_settings",{settings});
  $("proxyError").style.color="var(--ok)";$("proxyError").textContent=result;
 }catch(error){
  $("proxyError").style.color="var(--er)";$("proxyError").textContent=String(error);
 }
}
async function applyProxySettings(){
 const settings={enabled:$('sProxyEnabled').checked,protocol:$('sProxyType').value,host:$('sProxyHost').value.trim(),port:Math.min(65535,Math.max(1,Number($('sProxyPort').value)||0)),username:$('sProxyUsername').value,password:$('sProxyPassword').value};
 try{
  await invoke("set_proxy_settings",{settings});
  $("proxyError").textContent="";
 }catch(error){
  $("proxyError").textContent=String(error);
 }
}
async function saveSet(){
 await connectionSettingsReady;
 $("proxyError").textContent="";
 $("proxyError").style.color="var(--er)";
 const proxy={enabled:$("sProxyEnabled").checked,protocol:$("sProxyType").value,host:$("sProxyHost").value.trim(),port:Math.min(65535,Math.max(1,Number($("sProxyPort").value)||0)),username:$("sProxyUsername").value,password:$("sProxyPassword").value};
 try{await invoke("set_proxy_settings",{settings:proxy})}
 catch(error){$("proxyError").textContent=String(error);return}
 const nextCompletionAction=["none","shutdown","sleep"].includes($("sCompletionAction").value)?$("sCompletionAction").value:"none";
 try{await invoke("set_completion_action",{action:nextCompletionAction})}
 catch(error){$("proxyError").textContent=String(error);return}
 const nextDir=$("sDir").value.trim();
 try{await invoke("set_download_dir",{path:nextDir})}
 catch(error){$("proxyError").textContent=String(error);return}
 const nextConnections=Math.min(32,Math.max(1,+$("sConn").value||8));
 try{await invoke("set_download_connections",{connections:nextConnections})}
 catch(error){$("proxyError").textContent=String(error);return}
 lang=$("sLang").value;themeMode=$("sTheme").value;conns=nextConnections;dir=nextDir;completionAction=nextCompletionAction;
 appScale=Math.min(120,Math.max(80,Number($("sScale").value)||100));
 appFontSize=Math.min(18,Math.max(12,Number($("sFontSize").value)||14));
 windowOpacity=Math.min(100,Math.max(30,Number($("sTransparency").value)||100));
 localStorage.lang=lang;localStorage.theme=themeMode;localStorage.conns=conns;localStorage.dir=dir;localStorage.completionAction=completionAction;
 localStorage.appScale=appScale;localStorage.appFontSize=appFontSize;localStorage.windowOpacity=windowOpacity;
 $("dSet").close();applyTheme();applyLang();applyDisplaySettings()}
$("sProxyEnabled").addEventListener("change",applyProxySettings);
async function openProjectPage(){
 try{await invoke("open_project_page")}catch(error){alert(String(error))}
}
async function openBrowserGuide(browser){
 try{
  await invoke("open_browser_install_guide",{browser,language:lang});
 }catch(error){alert(t("browserGuideFailed")+"\n"+error)}
}
let updateDownloadUrl="";
async function checkForUpdate(manual=false){
 const button=$("checkUpdateButton");
 if(button.disabled)return;
 button.disabled=true;
 const label=button.querySelector("span");
 const previousLabel=label.textContent;
 if(manual)label.textContent=t("checkingUpdates");
 try{
  const update=await invoke("check_for_update");
  if(!update){if(manual)alert(t("upToDate"));return}
  $("currentVersion").textContent=update.current_version;
  $("latestVersion").textContent=update.latest_version;
  $("updateNotes").textContent=update.release_notes||t("upToDate");
  updateDownloadUrl=update.download_url;
  $("dUpdate").showModal();
 }catch(error){console.warn("Could not check for updates:",error);if(manual)alert(t("updateCheckFailed")+"\n"+error)}
 finally{button.disabled=false;label.textContent=previousLabel}
}
async function openUpdatePage(){
 try{await invoke("open_release_page",{url:updateDownloadUrl});$("dUpdate").close()}
 catch(error){alert(String(error))}
}
$("sScale").addEventListener("input",event=>{$("sScaleValue").textContent=event.target.value+"%"});
$("paletteGrid").addEventListener("click",event=>{const option=event.target.closest("[data-palette]");if(option)choosePalette(option.dataset.palette)});
$("sFontSize").addEventListener("input",event=>{$("sFontSizeValue").textContent=event.target.value+" px"});
$("sTransparency").addEventListener("input",event=>{windowOpacity=Number(event.target.value);$("sTransparencyValue").textContent=(100-windowOpacity)+"%";applyDisplaySettings();localStorage.windowOpacity=windowOpacity});
$("tb").addEventListener("change",e=>{const checkbox=e.target.closest("input[data-select-id]");if(!checkbox)return;const id=+checkbox.dataset.selectId;if(checkbox.checked)selectedIds.add(id);else selectedIds.delete(id);sel=id;render()});
function sortBy(key){if(!SORT_KEYS.includes(key))return;if(sortKey===key)sortDirection=sortDirection==="ascending"?"descending":"ascending";else{sortKey=key;sortDirection="ascending"}localStorage.sortKey=sortKey;localStorage.sortDirection=sortDirection;render()}
document.querySelector("thead").addEventListener("click",e=>{const header=e.target.closest("th[data-sort]");if(header)sortBy(header.dataset.sort)});
document.querySelector("thead").addEventListener("keydown",e=>{const header=e.target.closest("th[data-sort]");if(header&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sortBy(header.dataset.sort)}});
$("selectVisible").addEventListener("change",e=>{const visible=data.filter(d=>(!q||d.name.toLowerCase().includes(q))&&(cat==="all"||(cat==="unfinished"?d.status!=="completed":cat==="completed"?d.status==="completed":catOf(d)===cat)));for(const d of visible){if(e.target.checked)selectedIds.add(d.id);else selectedIds.delete(d.id)}sel=null;render()});
$("tb").addEventListener("click",e=>{const r=e.target.closest("tr.r");if(!r||e.target.closest("input[type=checkbox]"))return;sel=+r.dataset.id;if(e.ctrlKey||e.metaKey){selectedIds.has(sel)?selectedIds.delete(sel):selectedIds.add(sel)}else{selectedIds.clear();selectedIds.add(sel)}render()});
$("tb").addEventListener("dblclick",e=>{const r=e.target.closest("tr.r");if(r)resumeDownload(+r.dataset.id)});
document.documentElement.append($("rowMenu"));
$("tb").addEventListener("contextmenu",e=>{
 const r=e.target.closest("tr.r");if(!r)return;
 e.preventDefault();sel=+r.dataset.id;if(!selectedIds.has(sel)){selectedIds.clear();selectedIds.add(sel)}render();
 const menu=$("rowMenu");menu.hidden=false;renderRowMenu();
 const rect=menu.getBoundingClientRect();
 menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-rect.width-8))+"px";
 menu.style.top=Math.max(8,Math.min(e.clientY,innerHeight-rect.height-8))+"px";
 menu.querySelector("button:not(:disabled)").focus({preventScroll:true});
});
document.addEventListener("contextmenu",e=>e.preventDefault());
$("rowMenu").addEventListener("click",e=>{
 const button=e.target.closest("button[data-action]");if(!button||button.disabled)return;
 const action=button.dataset.action,id=sel;hideRowMenu();runRowAction(action,id);
});
document.addEventListener("pointerdown",e=>{if(!$("rowMenu").hidden&&!$("rowMenu").contains(e.target))hideRowMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideRowMenu()});
window.addEventListener("blur",hideRowMenu);
$("cats").addEventListener("click",e=>{const c=e.target.closest(".cat");if(c){cat=c.dataset.c;render()}});
const activeDownloadWindows=new Set();
invoke("set_completion_action",{action:completionAction}).catch(error=>console.error("Could not restore download completion action:",error));
listen("completion-action-error",event=>alert("Could not run the download completion action: "+event.payload));
listen("downloads",e=>{
 data=e.payload;render();
 const downloadIds=new Set(data.map(d=>d.id));
 for(const id of activeDownloadWindows)if(!downloadIds.has(id))activeDownloadWindows.delete(id);
 for(const download of data){
  if(download.status==="downloading"&&!activeDownloadWindows.has(download.id)){
   activeDownloadWindows.add(download.id);
   invoke("open_download_window",{id:download.id}).catch(error=>alert(String(error)));
  }else if(download.status!=="downloading"){
   activeDownloadWindows.delete(download.id);
  }
 }
}).catch(error=>alert("Could not monitor downloads: "+error));
function renderAppVersion(){
 if(appVersion===null)return;
 const digits=new Intl.NumberFormat(localeForLang(),{useGrouping:false});
 const localizedVersion=appVersion.replace(/\d/g,d=>digits.format(Number(d)));
 $("appVersion").textContent=t("version")+" "+localizedVersion;
}
async function showAppVersion(){
 try{appVersion=await invoke("app_version");renderAppVersion()}
 catch(error){console.warn("Could not read application version:",error)}
}
applyTheme();
applyLang();
applyDisplaySettings();
showAppVersion();
invoke("default_dir").then(async configuredDir=>{
 if(dir){
  try{await invoke("set_download_dir",{path:dir})}
  catch(error){console.warn("Could not restore the saved download folder:",error);dir=configuredDir;localStorage.dir=dir}
 }else{dir=configuredDir;localStorage.dir=dir}
}).catch(error=>console.warn("Could not load the download folder:",error));
checkForUpdate();
